name: Update live tile

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, 14:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/live-tile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Redraw tile from BLS
        run: python scripts/update_live_tile.py
      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain assets data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets data
            git commit -m "Update live tile from BLS"
            git push
          else
            echo "No change"
          fi
