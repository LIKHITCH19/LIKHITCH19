<text x="418.0" y="78.5" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" class="fade" style="animation-delay:1.20s">β 0.67</text>
<text x="300" y="130.0" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" class="fade" style="animation-delay:0.50s">GRE</text>
