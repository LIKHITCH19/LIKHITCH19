<svg xmlns="http://www.w3.org/2000/svg" width="405" height="194" viewBox="0 0 480 230" role="img" aria-label="Graduate admissions regression: R-squared 78.1%, standardized beta CGPA 0.67 vs GRE 0.25">
<title>Graduate admissions regression: R-squared 78.1%, standardized beta CGPA 0.67 vs GRE 0.25</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.25,.1,.25,1) forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .rise { animation: none; opacity: 1; }
  }
  
</style>

<rect x="0.5" y="0.5" width="479" height="229" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="24" y="38" font-size="11.5" font-weight="600" fill="#818b98" text-anchor="start" letter-spacing="1.2" class="fade" style="animation-delay:0.00s">PYTHON · MINITAB</text>
<text x="24" y="64" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start" class="fade" style="animation-delay:0.10s">Graduate admissions model</text>
<text x="24" y="112" font-size="34" font-weight="700" fill="#1f2328" text-anchor="start" class="rise" style="animation-delay:0.35s">R² 78.1%</text>
<text x="24" y="136" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" class="fade" style="animation-delay:0.50s">chance of admit from GRE and CGPA</text>
<text x="24" y="166" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" class="fade" style="animation-delay:0.65s">Corrected my own report: CGPA</text>
<text x="24" y="184" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" class="fade" style="animation-delay:0.70s">matters ~2.7x more than GRE.</text>
<text x="24" y="210" font-size="12" font-weight="600" fill="#2a78d6" text-anchor="start" class="fade" style="animation-delay:0.90s">Open repo →</text>
